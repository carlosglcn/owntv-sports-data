name: probe-rally
on:
  push:
    branches: [debug-rally]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find the API behind the Dakar race centre; WRC from ewrc
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          B=https://www.dakar.live.worldrallyraidchampionship.com
          C="curl -s -L --compressed -A"
          $C "$UA" $B/ -o index.html; wc -c index.html
          grep -aoE '(src|href)=[^ >]*\.js' index.html | head -20 || true
          touch all.js
          for f in $(grep -aoE '/?js/[0-9a-z.]+\.js' index.html | sed 's#^js#/js#' | sort -u); do $C "$UA" "$B$f" >> all.js; done; wc -c all.js
          echo "--- fetch calls"; grep -aoE '(fetch|bind|binds|getBind|liveFetch)\(\[?[`"][^`"]{2,80}[`"]' all.js | sort | uniq -c | sort -rn | head -60
          echo "--- template binds"; grep -aoE '`[a-z]+(-\$\{[^}]+\}|-[a-z]+)+(:\$\{[^}]+\})?`' all.js | sort | uniq -c | sort -rn | head -60
          echo "=== tries"
          for e in "race-dak2026" "stage-dak2026" "category-dak2026" "race" ; do printf "%-22s" $e; curl -s -L --compressed --max-time 15 -A "$UA" -w " [HTTP %{http_code} %{size_download}B]" "$B/api/$e" | head -c 300; echo; done
