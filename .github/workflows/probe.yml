name: probe-handball
on:
  push:
    branches: [probe-handball]
    paths: [scripts/handball.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/handball.py > probe/run.txt 2>&1 || true
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe/run.txt ehfcl.json ehfel.json lnh.json hhl.json khl.json hbl.json 2>/dev/null || true
          git add -A probe; git commit -qm "probe: handball run" || true; git push
