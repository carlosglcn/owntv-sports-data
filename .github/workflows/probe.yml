name: probe
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 scripts/basket.py > probe/out.txt 2>&1 || true
          cp eurocup.json primerafeb.json lega.json probe/ 2>/dev/null || true
          ls logos/lega | head -3 >> probe/out.txt || true
          git config user.name probe; git config user.email actions@github.com
          git add -f probe; git commit -qm probe; git push -q origin HEAD:probe
