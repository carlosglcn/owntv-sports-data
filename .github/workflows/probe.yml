name: probe-rally
on:
  push:
    branches: [debug-rally]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find the API behind the Dakar race centre; WRC from ewrc
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          B=https://www.dakar.live.worldrallyraidchampionship.com
          C="curl -s -L --compressed -A"
          $C "$UA" $B/ -o index.html; wc -c index.html
          grep -aoE '(src|href)=[^ >]*\.js' index.html | head -20 || true
          touch all.js
          for f in $(grep -aoE '/?js/[0-9a-z.]+\.js' index.html | sed 's#^js#/js#' | sort -u); do $C "$UA" "$B$f" >> all.js; done; wc -c all.js
          for e in lastScore-2026-A-10 generalRank-2026-A allClazz-2026-A withdrawal-2026-A lastScore-2026-M-13 generalRank-2026-M category-2026 stage-2026-A; do curl -s -L --compressed --max-time 30 -A "$UA" "$B/api/$e" -o "$e.json"; echo "=== $e $(wc -c < $e.json)B"; python3 -c "
import json,sys
d=json.load(open(sys.argv[1]))
def shape(x,depth=0):
    if isinstance(x,dict): return {k:shape(v,depth+1) for k,v in list(x.items())[:40]} if depth<4 else '{..}'
    if isinstance(x,list): return [shape(x[0],depth+1),'len=%d'%len(x)] if x else []
    return x if not isinstance(x,str) or len(x)<60 else x[:60]
print(type(d).__name__, len(d))
print(json.dumps(shape(d[0] if isinstance(d,list) and d else d),ensure_ascii=False)[:2600])
" "$e.json" 2>&1 | head -c 2800; echo; done
