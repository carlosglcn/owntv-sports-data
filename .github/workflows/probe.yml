name: probe-rally
on:
  push:
    branches: [debug-rally]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find the API behind the Dakar race centre; WRC from ewrc
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          B=https://www.dakar.live.worldrallyraidchampionship.com
          C="curl -s -L --compressed -A"
          $C "$UA" $B/ -o index.html; wc -c index.html
          grep -aoE '(src|href)=[^ >]*\.js' index.html | head -20 || true
          touch all.js
          for f in $(grep -aoE '/?js/[0-9a-z.]+\.js' index.html | sed 's#^js#/js#' | sort -u); do $C "$UA" "$B$f" >> all.js; done; wc -c all.js
          echo "--- lastScore"; grep -aoE '.{0,40}lastScore[:=]["`].{0,200}|.{0,200}(binds|bind)\s*[:=]\s*\{[^}]{0,400}' all.js | head -12
          echo "--- bindDatas keys"; grep -aoE 'bindDatas\.[a-zA-Z_]+' all.js | sort | uniq -c | sort -rn | head -30
          echo "--- keyed templates"; grep -aoE '[a-zA-Z_]+:`[a-zA-Z_]+-\$\{[^`]{1,160}`' all.js | sort -u | head -40
          echo "--- keyed strings"; grep -aoE '(lastScore|allClazz|withdrawal|waypoint|stage|category)[a-zA-Z]*:"[^"]{1,80}"' all.js | sort -u | head -30
