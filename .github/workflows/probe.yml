name: probe-handball
on:
  push:
    branches: [probe-handball]
    paths: [probe/tennis_probe.py, scripts/tennis.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/tennis_probe.py || true
      - run: |
          if [ -f scripts/tennis.py ]; then python3 scripts/tennis.py > probe/tennis_run.txt 2>&1 || true; fi
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A probe tennis.json 2>/dev/null || git add -A probe; git commit -qm "probe: tennis" || true; git push
