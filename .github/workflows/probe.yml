name: probe-rally
on:
  push:
    branches: [debug-rally]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find the API behind the Dakar race centre; WRC from ewrc
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          B=https://www.dakar.live.worldrallyraidchampionship.com
          C="curl -s -L --compressed -A"
          $C "$UA" $B/ -o index.html; wc -c index.html
          grep -aoE '(src|href)=[^ >]*\.js' index.html | head -20 || true
          touch all.js
          for f in $(grep -aoE '/?js/[0-9a-z.]+\.js' index.html | sed 's#^js#/js#' | sort -u); do $C "$UA" "$B$f" >> all.js; done; wc -c all.js
          echo "--- rank words"; grep -aoE '.{0,140}(scratch|Scratch|generalRanking|stageRanking|ranking[A-Z][a-zA-Z]*|getRanking|rankingType|teamRanking).{0,140}' all.js | head -30
          echo "--- _bind origins"; grep -aoE '_origin|_bind' all.js | sort | uniq -c
          echo "--- strings with -\${"; grep -aoE '`[a-zA-Z_]+-\$\{[^`]{1,120}`' all.js | sort -u | head -80
          for e in "vehicles-2026-A" "vehicles-2026-M" "team-2026" "ranking-2026-A" "general-2026-A" "scratch-2026-A" "rankings-2026-A"; do printf "%-22s" $e; curl -s -L --compressed --max-time 20 -A "$UA" -w " [HTTP %{http_code} %{size_download}B]" "$B/api/$e" | head -c 600; echo; done
