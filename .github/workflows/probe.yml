name: probe-asobal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_asobal.py
      - name: Commit the probe
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add probe
          git diff --cached --quiet || { git commit -qm "Probe asobal"; git pull -q --rebase; git push; }
