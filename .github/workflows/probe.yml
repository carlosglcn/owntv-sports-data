name: probe-rally
on:
  push:
    branches: [debug-rally]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find the API behind the Dakar race centre; WRC from ewrc
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          B=https://www.dakar.live.worldrallyraidchampionship.com
          C="curl -s -L --compressed -A"
          $C "$UA" $B/ -o index.html; wc -c index.html
          grep -aoE '(src|href)=[^ >]*\.js' index.html | head -20 || true
          touch all.js
          for f in $(grep -aoE '/?js/[0-9a-z.]+\.js' index.html | sed 's#^js#/js#' | sort -u); do $C "$UA" "$B$f" >> all.js; done; wc -c all.js
          echo "--- hosts"; grep -aoE 'https?://[a-zA-Z0-9.-]+' all.js | sort | uniq -c | sort -rn | head -40
          echo "--- api paths"; grep -aoE '"/?(api|v[0-9])/[a-zA-Z0-9/._{}$-]*"' all.js | sort -u | head -60
          echo "--- baseURL"; grep -aoE '(baseURL|apiUrl|API_URL|apiBase)[^;]{0,160}' all.js | head -10
          echo "=== ewrc"
          $C "$UA" --max-time 25 -w "\n[HTTP %{http_code} %{url_effective}]\n" "https://www.ewrc-results.com/season/2026/1-wrc/" | grep -aoE '<title>[^<]*|\[HTTP [^]]*\]|/final/[0-9]+-[a-z0-9-]+/' | sort -u | head -20
