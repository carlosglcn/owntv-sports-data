name: explore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf explore; mkdir -p explore
          curl -sL -m 60 "https://www.thesportsdb.com/api/v1/json/123/eventsseason.php?id=4408&s=2026-2027" -o explore/acb.json
          curl -sL -m 60 "https://api-live.euroleague.net/v2/competitions/E/seasons/E2026/games" -o explore/el2.json
          curl -sL -m 60 "https://api-live.euroleague.net/v1/schedules?seasonCode=E2026" -o explore/el1.xml
          curl -sL -m 60 "https://api-live.euroleague.net/v1/standings?seasonCode=E2026&gameNumber=99" -o explore/elst.xml
          python3 - <<'P' > explore/summary.txt
          import json,re
          a=json.load(open('explore/acb.json'))['events']
          print('ACB events',len(a), 'with score',sum(1 for e in a if e['intHomeScore'] not in (None,'')))
          print('ACB sample',{k:a[0][k] for k in ('strHomeTeam','strAwayTeam','intHomeScore','intAwayScore','strTimestamp','intRound','strStatus','strPostponed') if k in a[0]})
          print('ACB rounds',sorted({e['intRound'] for e in a},key=lambda x:int(x or 0))[-3:])
          d=json.load(open('explore/el2.json'))
          g=d['data']; print('EL v2 keys',list(d.keys()),'games',len(g))
          played=[x for x in g if x.get('played')]
          print('EL played',len(played)); print(json.dumps(played[0] if played else g[0])[:1800])
          x=open('explore/el1.xml').read()
          print('EL v1 items',x.count('<item>')); i=x.find('<item>'); 
          print([m for m in re.findall(r'<(\w+)>',x[i:i+3000])][:40])
          s=open('explore/elst.xml').read(); print('EL standings teams',s.count('<team>'), s[:300])
          P
          git config user.name "github-actions"; git config user.email "actions@github.com"
          rm -f explore/*.json explore/*.xml
          git add -A; git commit -qm "explore results"; git push
