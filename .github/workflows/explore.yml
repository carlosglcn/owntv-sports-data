name: explore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf explore; mkdir -p explore
          for p in calendario clasificacion; do curl -sL -m 60 -A "Mozilla/5.0" "https://www.acb.com/$p" -o explore/$p.html; done
          python3 - <<'P' > explore/summary.txt
          import re
          for p in ('calendario','clasificacion'):
              h=open(f'explore/{p}.html').read()
              print('=====',p,len(h),'__NEXT_DATA__' in h, h.count('self.__next_f.push'))
              print('links',sorted(set(re.findall(r'href="(/[^"]*(?:calendario|clasificacion|partido|jornada|temporada)[^"]*)"',h)))[:40])
              for m in re.finditer(r'(Bilbao|Manresa)',h):
                  print(h[max(0,m.start()-300):m.start()+500].replace('\n',' ')); break
              txt=re.sub(r'<script.*?</script>','',h,flags=re.S); txt=re.sub(r'<[^>]+>','|',txt); txt=re.sub(r'\|+','|',txt)
              print('TEXT',txt[:3000])
          P
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git commit -qm "explore results"; git push
