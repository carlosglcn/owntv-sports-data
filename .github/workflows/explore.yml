name: explore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf explore; mkdir -p explore; i=0
          for u in \
            "https://www.thesportsdb.com/api/v1/json/123/eventsseason.php?id=4408&s=2026-2027" \
            "https://www.thesportsdb.com/api/v1/json/123/lookuptable.php?l=4408&s=2026-2027" \
            "https://www.thesportsdb.com/api/v1/json/123/eventsnextleague.php?id=4408" \
            "https://www.acb.com/calendario" \
            "https://www.acb.com/clasificacion" \
            "https://www.acb.com/resultados-clasificacion" \
            "https://www.acb.com/" \
            "https://api-live.euroleague.net/v1/standings?seasonCode=E2026&gameNumber=7" ; do
            i=$((i+1)); { echo "URL $u"; curl -sL -m 30 -A "Mozilla/5.0" -w "\nHTTP %{http_code} %{size_download}\n" "$u" | head -c 3000; } > explore/$i.txt
          done
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add explore; git commit -qm "explore results"; git push
