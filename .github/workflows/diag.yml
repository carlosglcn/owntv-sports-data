name: diag
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/diag.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add probe3
          git commit -qm "diag" && git pull -q --rebase && git push
